# Kasi-Crunch settings. Copy this file to config.properties and fill in your
# MySQL details. config.properties is ignored by Git so passwords stay local.
# Any setting can also come from an environment variable, e.g.
# KASICRUNCH_DB_PASSWORD overrides db.password (useful on a cloud host).

db.host=localhost
db.port=3306
db.name=kasi_crunch
db.user=root
db.password=

server.port=8080

# Admin account created the first time the database is set up.
admin.email=admin@kasicrunch.local
admin.password=Admin@2026
