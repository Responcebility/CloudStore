# CloudStore settings. Copy this file to config.properties and fill in your
# MySQL details. config.properties is ignored by Git so passwords stay local.
# Any setting can also come from an environment variable, e.g.
# CLOUDSTORE_DB_PASSWORD overrides db.password (useful on a cloud host).

db.host=localhost
db.port=3306
db.name=cloudstore
db.user=root
db.password=

server.port=8080

# Admin account created the first time the database is set up.
admin.email=admin@cloudstore.local
admin.password=Admin@2026
