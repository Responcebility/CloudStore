<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cf343b">
  <title>Your basket | Kasi-Crunch</title>
  <meta name="description" content="Review your basket and check out.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <main id="main" class="container" style="padding-bottom:80px">
    <section class="page-head">
      <p class="eyebrow">Almost there</p>
      <h1>Your <em>basket.</em></h1>
    </section>

    <div class="grid split">
      <section class="card" aria-label="Items in your basket"><div id="items"></div></section>

      <form class="card form-grid" id="checkout" novalidate>
        <h3 style="margin:0">Checkout</h3>
        <div id="login-note" class="notice" hidden>Please <a href="login.html?next=cart.html"><strong>sign in or create an account</strong></a> to order.</div>

        <fieldset style="border:0;padding:0;margin:0">
          <legend class="field" style="margin-bottom:8px">How would you like it?</legend>
          <div class="choice">
            <label><input type="radio" name="fulfilment" value="delivery" checked><span>🚗 Bring it to me</span></label>
            <label><input type="radio" name="fulfilment" value="collection"><span>🛍️ I'll collect (free)</span></label>
          </div>
        </fieldset>

        <div id="delivery-fields" class="form-grid">
          <div class="field"><label for="address">Delivery address</label>
            <input class="input" id="address" maxlength="200" autocomplete="street-address" placeholder="e.g. Block L, 1234 Soshanguve"><span class="field-error"></span></div>
          <div class="field"><label for="distance">Distance from our kitchen (km)</label>
            <input class="input" id="distance" type="number" inputmode="decimal" min="0.1" max="30" step="0.1" placeholder="e.g. 4.5">
            <small id="distance-hint">Delivery is R16 per km, up to 30 km.</small><span class="field-error"></span></div>
        </div>

        <div class="field"><label for="phone">Phone number</label>
          <input class="input" id="phone" maxlength="15" autocomplete="tel" inputmode="tel" placeholder="e.g. 0712345678"><span class="field-error"></span></div>
        <div class="field"><label for="payment">Pay on arrival with</label>
          <select class="input" id="payment"><option>Cash</option><option>Card</option></select></div>

        <div class="totals">
          <div><span>Food subtotal</span><strong id="sum-subtotal">R0.00</strong></div>
          <div><span id="delivery-label">Delivery</span><strong id="sum-delivery">R0.00</strong></div>
          <div class="total"><span>Total to pay</span><strong id="sum-total">R0.00</strong></div>
        </div>
        <div id="result" role="status"></div>
        <button class="button button-primary button-full" type="submit" id="place">Place my order ↗</button>
        <p class="muted small center" style="margin:0">Demo prototype: no real payment is taken.</p>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
