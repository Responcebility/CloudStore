<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cf343b">
  <title>Sign in | Kasi-Crunch</title>
  <meta name="description" content="Sign in or create a Kasi-Crunch account.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main id="main" class="container" style="max-width:500px;padding:56px 0 80px">
    <section class="card">
      <p class="eyebrow">Good to see you</p>
      <h2>Welcome <em>back.</em></h2>
      <p class="muted">Sign in to order, track your food and manage your Crunch Pass.</p>
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="login">Sign in</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="register">Create account</button>
      </div>

      <form class="form-grid" id="login-form" novalidate>
        <div class="field"><label for="login-email">Email address</label><input class="input" id="login-email" type="email" autocomplete="email" maxlength="120"><span class="field-error"></span></div>
        <div class="field"><label for="login-password">Password</label><input class="input" id="login-password" type="password" autocomplete="current-password" maxlength="72"><span class="field-error"></span></div>
        <div class="result" role="status"></div>
        <button class="button button-primary button-full" type="submit">Sign in ↗</button>
      </form>

      <form class="form-grid" id="register-form" novalidate hidden>
        <div class="field"><label for="reg-name">Your name</label><input class="input" id="reg-name" autocomplete="name" maxlength="80"><span class="field-error"></span></div>
        <div class="field"><label for="reg-email">Email address</label><input class="input" id="reg-email" type="email" autocomplete="email" maxlength="120"><span class="field-error"></span></div>
        <div class="field"><label for="reg-password">Password</label><input class="input" id="reg-password" type="password" autocomplete="new-password" maxlength="72">
          <small>At least 8 characters, with a letter and a number.</small><span class="field-error"></span></div>
        <div class="field"><label for="reg-confirm">Confirm password</label><input class="input" id="reg-confirm" type="password" autocomplete="new-password" maxlength="72"><span class="field-error"></span></div>
        <div class="result" role="status"></div>
        <button class="button button-primary button-full" type="submit">Create my account ↗</button>
      </form>
      <p class="muted small center" style="margin:18px 0 0">🔒 Passwords are securely hashed, never stored as plain text.</p>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
