<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Kasi-Crunch</title>
  <meta name="description" content="Log in or create a Kasi-Crunch account.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main id="main" class="container" style="max-width:470px">
    <section class="card glass" style="margin-top:16px">
      <div class="center">
        <div class="brand-mark" style="width:60px;height:60px;font-size:1.9rem;margin:0 auto 12px;border-radius:18px">🍗</div>
        <h1 style="font-size:2.1rem">Welcome back</h1>
        <p class="muted">Log in to order, track your food and manage your club.</p>
      </div>
      <div class="tabs glass" role="tablist">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="login">Log in</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="register">Create account</button>
      </div>

      <form class="form-grid" id="login-form" novalidate>
        <div class="field"><label for="login-email">Email</label><input class="input" id="login-email" type="email" autocomplete="email" maxlength="120"><span class="field-error"></span></div>
        <div class="field"><label for="login-password">Password</label><input class="input" id="login-password" type="password" autocomplete="current-password" maxlength="72"><span class="field-error"></span></div>
        <div class="result" role="status"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
      </form>

      <form class="form-grid" id="register-form" novalidate hidden>
        <div class="field"><label for="reg-name">Full name</label><input class="input" id="reg-name" autocomplete="name" maxlength="80"><span class="field-error"></span></div>
        <div class="field"><label for="reg-email">Email</label><input class="input" id="reg-email" type="email" autocomplete="email" maxlength="120"><span class="field-error"></span></div>
        <div class="field"><label for="reg-password">Password</label><input class="input" id="reg-password" type="password" autocomplete="new-password" maxlength="72">
          <span class="hint">At least 8 characters, with a letter and a number.</span><span class="field-error"></span></div>
        <div class="field"><label for="reg-confirm">Confirm password</label><input class="input" id="reg-confirm" type="password" autocomplete="new-password" maxlength="72"><span class="field-error"></span></div>
        <div class="result" role="status"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
