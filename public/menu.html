<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cf343b">
  <title>Menu | Kasi-Crunch</title>
  <meta name="description" content="The Kasi-Crunch menu: burgers, combos, chicken, sides, pies, rolls, ice cream and drinks.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu">
  <main id="main" class="container">
    <section class="page-head">
      <p class="eyebrow">Products &amp; services</p>
      <h1>The <em>menu.</em></h1>
      <p class="lead">Everything is made fresh once your order is in. Choose delivery (R16/km) or collect for free.</p>
    </section>

    <label class="visually-hidden" for="search">Search the menu</label>
    <input id="search" class="input search" type="search" maxlength="60" placeholder="Search: wings, burger, pie…">
    <div id="categories" class="category-list" aria-label="Filter the menu"></div>

    <div id="menu" style="padding-bottom:80px" aria-live="polite"><div class="loading-card">Getting the good stuff ready…</div></div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
